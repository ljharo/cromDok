# CronDok - Pre-commit hooks (spec 8.1)
# Instalacion: pre-commit install
# Verificacion manual: pre-commit run --all-files

repos:
  # Backend
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        # The hook runs from the repo root in an isolated env: point it at the
        # backend config and install the imports its analysis follows.
        files: ^backend/
        # Alembic env.py/versions are generated code; mypy checks explicitly
        # passed files even when they match the config's exclude regex.
        exclude: ^backend/alembic/
        args: [--config-file=backend/pyproject.toml]
        additional_dependencies:
          - "sqlalchemy>=2.0"
          - "pydantic-settings>=2.3"
          - "croniter>=2.0"
          - "types-croniter"
          - "pytest>=8.2"
          - "fastapi>=0.115,<0.116"
          - "httpx>=0.27,<0.28"
          - "pwdlib[argon2]>=0.3,<0.4"
          - "cryptography>=42.0"
          - "docker>=7.1,<8.0"

  # Frontend
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: \.(ts|tsx)$
        types: [file]
        additional_dependencies:
          - "eslint@8.57.1"
          - "@typescript-eslint/parser@7.18.0"
          - "@typescript-eslint/eslint-plugin@7.18.0"
          - "eslint-plugin-react-hooks@4.6.2"
          - "eslint-plugin-react-refresh@0.4.9"
          - "eslint-config-prettier@9.1.0"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(ts|tsx|json|css|md)$
        # docs/ se excluye: las reglas de formato de prettier no deben
        # reescribir la documentacion mantenida a mano.
        exclude: ^docs/

  # General
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/
      - id: end-of-file-fixer
        exclude: ^docs/
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  # Secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # Baseline: falsos positivos conocidos (ids de revision de Alembic,
        # passwords de fixtures de tests). Nuevos hallazgos siguen fallando.
        args: [--baseline, .secrets.baseline]
