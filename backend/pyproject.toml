[project]
name = "cron-dok"
version = "0.1.0"
description = "Self-hosted task scheduler: cron runners in Docker with a FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.115,<0.116)",
    "uvicorn[standard] (>=0.30,<0.31)",
    "apscheduler (>=3.10,<3.11)",
    "sqlalchemy[asyncio] (>=2.0,<3.0)",
    "aiosqlite (>=0.20)",
    "alembic (>=1.13,<2.0)",
    "pydantic (>=2.8,<3.0)",
    "pydantic-settings (>=2.3,<3.0)",
    "docker (>=7.1,<8.0)",
    "cryptography (>=42.0)",
    "croniter (>=2.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "httpx (>=0.27,<0.28)",
]

[tool.poetry]
packages = [{ include = "cron_dok", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2,<9.0"
pytest-asyncio = ">=0.23"
pytest-cov = ">=4.0"
ruff = ">=0.5"
mypy = ">=1.11"
types-croniter = ">=2.0.0.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
# ANN101/ANN102 (annotations for self/cls) were removed from ruff as noise,
# but ruff <= 0.7 (e.g. the v0.5.0 pre-commit hook) still enforces them.
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
# Explicit so both the Poetry ruff (cwd=backend/) and the pre-commit hook
# ruff (cwd=repo root, no src-layout detection) classify cron_dok the same.
known-first-party = ["cron_dok"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
# Matches both `alembic/...` (running from backend/) and `backend/alembic/...`
# (pre-commit hook running from the repo root).
exclude = "(^|/)alembic/"

[[tool.mypy.overrides]]
module = ["cron_dok.domain.*", "cron_dok.services.*"]
strict = true

[[tool.mypy.overrides]]
# APScheduler 3.x ships no type stubs nor a py.typed marker.
module = ["apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Test bodies use untyped pytest fixture parameters.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# docker-py ships no type stubs (types-docker is not packaged for it).
module = ["docker", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "docker: integration tests requiring a local Docker daemon (auto-skipped without one)",
]

[tool.coverage.run]
source = ["src/cron_dok"]
